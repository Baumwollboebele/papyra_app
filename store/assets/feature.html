<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
  .stage {
    width: 1024px; height: 500px; position: relative;
    background: radial-gradient(120% 140% at 12% 0%, #00897B 0%, #00695C 46%, #004D40 100%);
    overflow: hidden;
  }
  /* decorative soft circles */
  .blob { position: absolute; border-radius: 50%; opacity: .10; background: #fff; }
  .b1 { width: 420px; height: 420px; right: -120px; top: -160px; }
  .b2 { width: 300px; height: 300px; left: -120px; bottom: -150px; opacity: .07; }

  .left { position: absolute; left: 64px; top: 0; height: 500px;
    width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .brandRow { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; }
  .mark { width: 84px; height: 84px; background: #fff; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; }
  .word { color: #fff; font-size: 62px; font-weight: 800; letter-spacing: -1px; }
  .tag { color: #E0F2F1; font-size: 27px; font-weight: 500; line-height: 1.35;
    max-width: 500px; margin-bottom: 30px; }
  .tag b { color: #fff; font-weight: 700; }
  .chips { display: flex; gap: 12px; }
  .chip { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28);
    color: #fff; font-size: 19px; font-weight: 600; padding: 11px 18px; border-radius: 999px;
    display: flex; align-items: center; gap: 8px; }

  /* phone on the right */
  .phone { position: absolute; right: 40px; top: 72px; width: 300px; height: 600px;
    background: #0d1512; border-radius: 42px; padding: 12px;
    box-shadow: 0 30px 70px rgba(0,0,0,.45); transform: rotate(-7deg); }
  .screen { width: 100%; height: 100%; background: #F4FBF8; border-radius: 32px; overflow: hidden; }
  .appbar { background: #00695C; height: 96px; display: flex; align-items: flex-end;
    padding: 0 22px 16px; }
  .appbar span { color: #fff; font-size: 24px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .cat { background: #fff; border-radius: 16px; padding: 14px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .catIcon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 10px; }
  .catName { font-size: 15px; font-weight: 700; color: #17211E; }
  .catCount { font-size: 12px; color: #6b7a75; margin-top: 2px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="blob b1"></div>
    <div class="blob b2"></div>

    <div class="left">
      <div class="brandRow">
        <div class="mark">
          <svg viewBox="0 0 100 100" width="84" height="84">
            <rect x="28" y="20" width="44" height="60" rx="8" fill="#00695C"/>
            <rect x="36" y="34" width="28" height="4.5" rx="2.25" fill="#fff"/>
            <rect x="36" y="45" width="28" height="4.5" rx="2.25" fill="#fff"/>
            <rect x="36" y="56" width="23" height="4.5" rx="2.25" fill="#fff"/>
            <circle cx="63" cy="67" r="11" fill="#4DB6AC"/>
            <circle cx="63" cy="67" r="4.5" fill="#00695C"/>
          </svg>
        </div>
        <div class="word">Papyra</div>
      </div>
      <div class="tag">Dokumente scannen, <b>automatisch sortieren</b> und blitzschnell finden.</div>
      <div class="chips">
        <div class="chip">🔒 100 % offline</div>
        <div class="chip">🔎 Volltextsuche</div>
        <div class="chip">🧠 OCR am Gerät</div>
      </div>
    </div>

    <div class="phone">
      <div class="screen">
        <div class="appbar"><span>Ablage</span></div>
        <div class="grid">
          <div class="cat"><div class="catIcon" style="background:#E0F2F1"><svg width="20" height="20" viewBox="0 0 24 24" fill="#00695C"><path d="M4 4h16v4H4zM4 10h16v10H4z"/></svg></div><div class="catName">Rechnungen</div><div class="catCount">12 Dokumente</div></div>
          <div class="cat"><div class="catIcon" style="background:#E8F5E9"><svg width="20" height="20" viewBox="0 0 24 24" fill="#2E7D32"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 8h4v13h-4z"/></svg></div><div class="catName">Steuern</div><div class="catCount">5 Dokumente</div></div>
          <div class="cat"><div class="catIcon" style="background:#EDE7F6"><svg width="20" height="20" viewBox="0 0 24 24" fill="#5E35B1"><path d="M6 2h9l5 5v15H6z"/></svg></div><div class="catName">Verträge</div><div class="catCount">8 Dokumente</div></div>
          <div class="cat"><div class="catIcon" style="background:#FFF3E0"><svg width="20" height="20" viewBox="0 0 24 24" fill="#EF6C00"><path d="M12 2l9 4v6c0 5-3.8 8.5-9 10-5.2-1.5-9-5-9-10V6z"/></svg></div><div class="catName">Versicherung</div><div class="catCount">6 Dokumente</div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
