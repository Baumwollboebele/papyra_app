<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .preview { background:#fff; border-radius:22px; box-shadow:0 3px 14px rgba(0,0,0,.08);
    padding:26px; margin-bottom:22px; display:flex; gap:22px; align-items:center; }
  .page { width:150px; height:196px; background:#F0F7F4; border:1px solid #DDEAE5; border-radius:10px;
    flex:none; padding:18px; }
  .page .l { height:8px; border-radius:4px; background:#CBE0D9; margin-bottom:11px; }
  .conf { display:inline-flex; align-items:center; gap:10px; background:#E7F6EC; color:#1B7A38;
    font-size:22px; font-weight:700; padding:12px 20px; border-radius:999px; margin-bottom:8px; }
  .field { background:#fff; border-radius:18px; box-shadow:0 3px 12px rgba(0,0,0,.05);
    padding:20px 24px; margin-bottom:14px; }
  .field .k { font-size:20px; color:#6b7a75; font-weight:600; }
  .field .v { font-size:27px; color:#17211E; font-weight:700; margin-top:5px; display:flex; align-items:center; gap:12px; }
  .dot { width:18px; height:18px; border-radius:50%; background:#00695C; display:inline-block; }
  .save { margin:20px 4px 0; height:78px; border-radius:22px; background:#00695C; color:#fff;
    font-size:27px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:12px; }
</style></head>
<body>
<div class="wrap">
  <div class="blob bA"></div><div class="blob bB"></div>
  <div class="cap"><h1>Scannen –<br>automatisch erkannt</h1>
    <p>OCR & Kategorie in Sekunden</p></div>

  <div class="device"><div class="screen">
    <div class="status"><span>9:41</span><span class="dots">▲ ● ▮</span></div>
    <div class="appbar"><div class="t" style="font-size:30px">Prüfen &amp; speichern</div></div>
    <div class="body">
      <div class="conf"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B7A38" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg> Sicher erkannt</div>
      <div class="preview">
        <div class="page"><div class="l" style="width:70%"></div><div class="l" style="width:90%"></div><div class="l" style="width:60%"></div><div class="l" style="width:80%"></div><div class="l" style="width:45%"></div></div>
        <div style="flex:1">
          <div style="font-size:27px;font-weight:800;color:#17211E">Stromrechnung März 2026</div>
          <div style="font-size:21px;color:#6b7a75;margin-top:8px">2 Seiten · PDF</div>
        </div>
      </div>
      <div class="field"><div class="k">Kategorie</div><div class="v"><span class="dot"></span>Rechnungen</div></div>
      <div class="field"><div class="k">Absender</div><div class="v">Stadtwerke München</div></div>
      <div style="display:flex;gap:14px">
        <div class="field" style="flex:1"><div class="k">Betrag</div><div class="v">89,90 €</div></div>
        <div class="field" style="flex:1"><div class="k">Fällig am</div><div class="v">28.03.2026</div></div>
      </div>
      <div class="save"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M5 3h11l3 3v15H5zM8 3v6h7V3z"/></svg> Speichern</div>
    </div>
  </div></div>
</div>
</body></html>
